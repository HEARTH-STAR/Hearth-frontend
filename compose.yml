# The hosted stack on the VPS (README: "Hosting on a VPS"): Postgres and this app. Hearth-backend runs
# on the host, beside the Docker Engine it drives. Both networks are made once by hand:
#
#   docker network create --internal hearth-db                                   # Postgres; no route out
#   docker network create --subnet 172.30.0.0/24 --gateway 172.30.0.1 hearth     # this app ⇄ the host
#
# 172.30.0.1 is the host on the hearth network: Hearth-backend listens there, and publishes each
# Space's Hearth-Core port there (its HEARTH_PUBLISH_HOST), so neither is on the public interface.
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: hearth
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: hearth
    volumes:
      - hearth-postgres:/var/lib/postgresql/data
    # No ports: only containers on hearth-db reach it.
    networks:
      - hearth-db
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U hearth -d hearth']
      interval: 5s
      retries: 12
    restart: unless-stopped
  app:
    build:
      context: .
      target: app
    depends_on:
      postgres:
        condition: service_healthy
    # Loopback only: the reverse proxy on the host (HTTPS) is what the internet reaches.
    ports:
      - '127.0.0.1:4310:4310'
    environment:
      APP_ORIGIN: ${APP_ORIGIN:?Set APP_ORIGIN to the URL people open Hearth at}
      DATABASE_URL: postgres://hearth:${POSTGRES_PASSWORD}@postgres:5432/hearth
      CLERK_PUBLISHABLE_KEY: ${CLERK_PUBLISHABLE_KEY:?Set CLERK_PUBLISHABLE_KEY in .env}
      CLERK_SECRET_KEY: ${CLERK_SECRET_KEY:?Set CLERK_SECRET_KEY in .env}
      CLERK_WEBHOOK_SECRET: ${CLERK_WEBHOOK_SECRET:?Set CLERK_WEBHOOK_SECRET in .env}
      HEARTH_BACKEND_URL: ${HEARTH_BACKEND_URL:-http://172.30.0.1:5020}
      HEARTH_BACKEND_TOKEN: ${HEARTH_BACKEND_TOKEN:?Set HEARTH_BACKEND_TOKEN to Hearth-backend's HEARTH_API_TOKEN}
      HEARTH_SPACE_HOST: ${HEARTH_SPACE_HOST:-172.30.0.1}
      HEARTH_CONTAINER_TEMPLATE: ${HEARTH_CONTAINER_TEMPLATE:-}
      HEARTH_MODEL: ${HEARTH_MODEL:-}
      COPILOTKIT_TELEMETRY_DISABLED: ${COPILOTKIT_TELEMETRY_DISABLED:-true}
    networks:
      - hearth
      - hearth-db
    volumes:
      - hearth-data:/data
    init: true
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
networks:
  hearth:
    external: true
  hearth-db:
    external: true
volumes:
  hearth-postgres:
  hearth-data:
