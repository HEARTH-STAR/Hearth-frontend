services:
  app:
    build:
      context: .
      target: app
    ports:
      - '127.0.0.1:4310:4310'
    environment:
      OWNER_TOKEN: ${OWNER_TOKEN:?Set a 24+ character OWNER_TOKEN in .env}
      APP_ORIGIN: ${APP_ORIGIN:-http://localhost:4310}
      OWNER_ID: ${OWNER_ID:-hearth-owner}
      # Hearth-Core and Hearth-backend run on the host by default; they must listen on an
      # address this container can reach (not only 127.0.0.1).
      HEARTH_CORE_URL: ${HEARTH_CORE_URL:-http://host.docker.internal:5010}
      HEARTH_BACKEND_URL: ${HEARTH_BACKEND_URL:-http://host.docker.internal:5020}
      HEARTH_BACKEND_TOKEN: ${HEARTH_BACKEND_TOKEN:-}
      HEARTH_CONTAINER_TEMPLATE: ${HEARTH_CONTAINER_TEMPLATE:-}
      HEARTH_MODEL: ${HEARTH_MODEL:-}
      COPILOTKIT_TELEMETRY_DISABLED: ${COPILOTKIT_TELEMETRY_DISABLED:-true}
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    volumes:
      - hearth-data:/data
    init: true
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
volumes:
  hearth-data:
